<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>Screen Pet — 스토어 자산 미리보기</title>
  <style>
    :root {
      --paper: #efe7dd;
    }

    body {
      margin: 0;
      padding: 28px 32px 80px;
      background: var(--paper);
      color: #3a2a1e;
      font-family: -apple-system, "Pretendard", system-ui, sans-serif;
    }

    h1 {
      font-size: 19px;
      margin: 0 0 2px;
    }

    h2 {
      font-size: 15px;
      margin: 40px 0 4px;
    }

    p.sub {
      margin: 0;
      font-size: 12px;
      color: #8a6a54;
      line-height: 1.6;
    }

    .bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin: 16px 0 0;
    }

    .bar button {
      padding: 5px 11px;
      border: 1px solid #d0bda6;
      border-radius: 7px;
      background: #fff;
      color: #5a3a28;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .bar button.on {
      background: #e8936c;
      border-color: #e8936c;
      color: #fff;
      font-weight: 700;
    }

    /* ===== 아이콘 후보 ===== */
    .icons {
      display: flex;
      gap: 26px;
      margin-top: 14px;
    }

    .cand {
      background: #fff;
      border: 1px solid #ded0be;
      border-radius: 12px;
      padding: 14px 16px 12px;
    }

    .cand .name {
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .cand .note {
      font-size: 11px;
      color: #8a6a54;
      margin-bottom: 12px;
    }

    /* 실제 스토어/툴바에서 쓰이는 크기 그대로 나란히 둔다 */
    .sizes {
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }

    .sizes figure {
      margin: 0;
      text-align: center;
    }

    .sizes img {
      display: block;
      background: var(--chip, #fff);
      border-radius: 6px;
      image-rendering: auto;
    }

    .sizes figcaption {
      margin-top: 5px;
      font-size: 10px;
      color: #9c806a;
    }

    .s128 img { width: 128px; height: 128px; }
    .s48 img { width: 48px; height: 48px; }
    .s16 img { width: 16px; height: 16px; }

    /* ===== 큰 이미지 ===== */
    .shots {
      display: flex;
      flex-direction: column;
      gap: 22px;
      margin-top: 14px;
    }

    .shot {
      background: #fff;
      border: 1px solid #ded0be;
      border-radius: 12px;
      padding: 12px;
      width: max-content;
    }

    .shot img {
      display: block;
      width: 640px;
      height: 400px;
    }

    .shot.full img { width: 1280px; height: 800px; }

    .shot.tile img { width: 440px; height: 280px; }

    .shot .name {
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #6d5240;
    }

    .shot .name span {
      font-weight: 400;
      color: #9c806a;
    }
  </style>
</head>

<body>
  <h1>Screen Pet — 스토어 자산</h1>
  <p class="sub">
    실제 <code>pets.js</code> / <code>pets-pixel.js</code> / <code>styles.css</code> 를 물려서 Chrome 헤드리스로 구운 PNG 입니다.
    <br>다시 굽기: <code>./store/make.sh</code>
  </p>

  <h2>아이콘 후보 — 128 × 128</h2>
  <p class="sub">스토어는 128, 확장 관리 페이지는 48, 툴바는 16으로 씁니다. 16에서 뭉개지지 않는 게 제일 중요합니다.</p>
  <div class="bar" id="chipBar"><span class="sub">배경</span></div>
  <div class="icons" id="icons"></div>

  <h2>소개 이미지 — 1280 × 800</h2>
  <p class="sub">아래는 50% 축소본입니다. 실제 크기로 보려면 버튼을 누르세요.</p>
  <div class="bar" id="zoomBar"><span class="sub">배율</span></div>
  <div class="shots" id="shots"></div>

  <h2>작은 프로모션 타일 — 440 × 280</h2>
  <div class="shots" id="tile"></div>

  <script>
    const ICONS = [
      ['icon-a', 'A. 햄스터 얼굴', '이목구비를 크게 다시 그림. 16px 에서 가장 잘 버팀'],
      ['icon-b', 'B. 방석 위 낮잠', '확장의 시그니처 조합. 요소가 많아 작아지면 뭉개짐'],
      ['icon-c', 'C. 도트 햄스터', '실제 도트 테마 격자 그대로. 각져서 작아도 형태가 남음'],
      ['icon-d', 'D. 햄스터 전신', '배경 원 없이 투명. 툴바 배경색과 그대로 섞임'],
    ];
    const SHOTS = [
      ['shot-1', '1. 다섯 마리 소개'],
      ['shot-2', '2. 두 가지 아트 스타일'],
      ['shot-3', '3. 방석 옮기기 / 재우기'],
      ['shot-4', '4. 시간대별 인사'],
    ];

    const bust = `?t=${performance.now() | 0}`;

    document.getElementById('icons').innerHTML = ICONS.map(([f, name, note]) => `
      <div class="cand">
        <div class="name">${name}</div>
        <div class="note">${note}</div>
        <div class="sizes">
          ${[128, 48, 16].map((s) => `
            <figure class="s${s}">
              <img src="out/${f}.png${bust}" alt="${name} ${s}px">
              <figcaption>${s}px</figcaption>
            </figure>`).join('')}
        </div>
      </div>`).join('');

    document.getElementById('shots').innerHTML = SHOTS.map(([f, name]) => `
      <div class="shot">
        <div class="name">${name} <span>1280 × 800</span></div>
        <img src="out/${f}.png${bust}" alt="${name}">
      </div>`).join('');

    document.getElementById('tile').innerHTML = `
      <div class="shot tile">
        <div class="name">프로모션 타일 <span>440 × 280</span></div>
        <img src="out/tile.png${bust}" alt="promo tile">
      </div>`;

    function buildBar(hostId, items, initial, onPick) {
      const host = document.getElementById(hostId);
      const buttons = items.map((label) => {
        const b = document.createElement('button');
        b.textContent = label;
        b.addEventListener('click', () => {
          buttons.forEach((x) => x.classList.toggle('on', x === b));
          onPick(label);
        });
        if (label === initial) b.classList.add('on');
        host.appendChild(b);
        return b;
      });
    }

    // 아이콘은 툴바 배경색에 따라 인상이 달라진다. 투명 배경 후보(D) 판단에 필요.
    const CHIPS = { 'white': '#fff', 'grey': '#d8d8dc', 'dark': '#2b2b33' };
    buildBar('chipBar', Object.keys(CHIPS), 'white', (k) => {
      document.documentElement.style.setProperty('--chip', CHIPS[k]);
    });

    buildBar('zoomBar', ['50%', '100%'], '50%', (k) => {
      document.querySelectorAll('.shots .shot').forEach((el) => {
        if (!el.classList.contains('tile')) el.classList.toggle('full', k === '100%');
      });
    });
  </script>
</body>

</html>
